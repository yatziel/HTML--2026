<!-- 
 
    Listas

    Nos ayudan a estructura información ordenada y no ordenada.

    Ordenadas 👉 Llevan numeraión y la sintaxis es:

    <ol>...</ol>

    No Ordenadas 👉 Llevan bullets o viñetas y la sintaxis es:

    <ul>...</ul>

    Para los elementos delista se usa la sintaxis:

    <li>...</li>

    Existe el atributo 'type' que permite cambair el tipo de numeración y bullet de una lista.

    Para las listas ordenadas los valores son:

    1   👉 Tipo numero (default)
    a/A 👉 Tipo alfabeto
    i/I 👉 Tipo romano

    Paras las listas no ordendas los valores son:

    disc 👉 balas o puntitos (default)
    circle 👉 circulos
    square 👉 cuadros

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Listas</title>
</head>
<body>
    <h1>✅ Listas</h1>
    <p>Tenemos listas ordenadas y no ordenadas.</p>

    <h2>Mi comida favorita</h2>
    <ol type="I">
        <li>Pizza 🍕</li>
        <li>Pollito Enchilado 🐔</li>
        <li>Wacamole 🥑</li>
    </ol>

    <h2>Mis pokemones</h2>
    <ul type="square">
        <li>Snorlax 💤</li>
        <li>Charizard 🔥</li>
        <li>Ditto 🍮</li>
    </ul>
</body>
</html>
