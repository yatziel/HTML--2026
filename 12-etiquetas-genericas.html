<!-- 
 
    Etiquetas Genéricas

    Existen dos que nos ayudan a crear elementos de tipo bloque y línea.

    div 👉 Se usa como un contenedor de división y semánticamente no significa nada. Sirve como contender de bloque.

    span 👉 Ses un contenedor de tipo línea, se suele usar para encerrar palabras o pequeños textos. Semánticamente no significa nada.

    Contenedor de bloque - ocupan todo el ancho dispobinible y darán un salto de línean.

    Contenedor de línea - va ocupar el ancho de su cotenido y no da salto de línea.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Etiquetas Genéricas</title>
</head>
<body>
    <h1>📍 Etiquetas Genéricas</h1>

    <div>
        Este es un <span style="color:red">elemento</span> de bloque! 🧱
    </div>

    <div>
        Este es otro elemento de bloque! 🗿 <span>Y este es otro elemento de línea! 📞</span>
    </div>
</body>
</html>
