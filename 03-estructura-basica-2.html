<!-- 
 
    Para crear la estructura básica podemos usar Emmet.

    Emmet es una herramienta de autocompletado integrada en VSC.

    El shortcut para escribir la estructura: !

    Atributos
    
    lang 👉 Determina el idioma en el que esta escrito el documento
    charset 👉 Determina el conjunto de caracteres que se usa en el documento.

    Etiquetas

    Meta viewport 👉 Permite que nuestro documetno se vea correctamente en dispositivos móviles. Siempre debe de estar. Las etiqueta meta se autocierran 'selfclosing'. No tienen una etiqueta de cierre.

    title 👉 Define el titulo del documento. Este título si es visible para el usuario y se ubica en las pestañas del navegador.

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya me dió miedo el Profe Yatto! 🤯</title>
</head>
<body>
    
</body>
</html>
