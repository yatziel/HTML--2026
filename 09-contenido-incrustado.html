<!-- 
 
    Contenido Incrustado (Iframes)

    Sirve para incrustar contenido externo como videos de youtube, mapas, documentos, interfaces...

    - src: direccción del contenido
    - width: ancho
    - heigth: alto
    - allowfullscreen: premite la pantalla completa

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👽 Iframes</title>
</head>
<body>
    <h1>👽 Iframes</h1>

    <h2>Video youtube</h2>
    <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/20jIHzoyGtI?si=0TDOayLVq_6asuMp" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Mapa de google</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3771.3614243493203!2d-98.21385132382115!3d19.047840482150992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfc6d4531e0fff%3A0xaf32047582fa31ba!2sAS%20Media%20Centro%20de%20Formaci%C3%B3n%20Profesional%20A.C.!5e0!3m2!1sen!2smx!4v1792444654930!5m2!1sen!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>Revista Heyzine Flipbook</h2>
    <iframe src="https://heyzine.com/flip-book/383f213883.html#page/1" frameborder="0" width="1024px" height="600px"></iframe>

</body>
</html>
