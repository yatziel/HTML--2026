<!-- 
    
    Enlaces

    Los enlaces nos permiten crear navegación internas y externas html.

    Sintaxis:

    <a>...</a>

    Los enlaces requieren del atributo 'href' pra funcionar como elementos interactivos.

    Sintaxis:

    <a href="...">...</a>

    El atributo "href" puede recibir varios valores, los principales:

    👉 Url externa
    👉 La ruta (path) de un archivo html
    👉 El id de un elemento de html
    👉 # Deadlink (Enlace muerto)

    El atributo "target" nos premite indicarle al enlace que se debe abrir en una pestaña nueva cuando usamos el valor "_blank"

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 Enlaces</title>
</head>
<body>
    <a href="https://www.tiktok.com" target="_blank">Esto es un enlace externo!</a>
    <br>
    <a href="04-etiquetas-texto.html">Enlace a otro documento de html</a>
    <br>
    <a href="#cuchurrumina">Este es un enlace hacia un elemento de html</a>
    <br>
    <a href="#">Esto es un enlace muerto</a>
   
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <h2 id="cuchurrumina">Elemento para enlazar</h2>

     <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
